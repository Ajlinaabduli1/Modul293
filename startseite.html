<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Startseite – All About Ajlina</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bevan&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet" />

  <style>
    /* ── CSS Variables ─────────────────────────────────────── */
    :root {
      --teal:       #7FA9AE;
      --blue:       #6B9AC4;
      --yellow:     #F6E7A1;
      --offwhite:   #F9F7F3;
      --lightblue:  #D6E0EA;
      --dark:       #2F3E46;
      --white:      #ffffff;
    }

    /* ── Reset ─────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Roboto', sans-serif;
      background: var(--offwhite);
      color: var(--dark);
    }

    /* ══════════════════════════════════════════════════════════
       HEADER / NAVBAR
    ══════════════════════════════════════════════════════════ */
    header {
      background: var(--blue);
      height: 36px;
      display: flex;
      align-items: center;
      padding: 0 16px;
      gap: 12px;
    }

    /* Logo area */
    .logo {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    /* CPU icon – drawn with pure CSS */
    .cpu-icon {
      width: 22px;
      height: 22px;
      position: relative;
      flex-shrink: 0;
    }
    .cpu-icon svg {
      width: 22px;
      height: 22px;
    }

    .logo-text {
      display: flex;
      flex-direction: column;
      line-height: 1;
    }
    .logo-text .aaa {
      font-family: 'Roboto', sans-serif;
      font-weight: 700;
      font-size: 11px;
      color: var(--dark);
      letter-spacing: 1px;
    }
    .logo-text .sub {
      font-family: 'Roboto', sans-serif;
      font-weight: 400;
      font-size: 7px;
      color: var(--dark);
      letter-spacing: 0.3px;
    }

    /* Nav links */
    nav {
      display: flex;
      align-items: center;
      gap: 2px;
      margin-left: 4px;
    }
    nav a {
      font-family: 'Roboto', sans-serif;
      font-size: 10px;
      text-decoration: none;
      color: var(--dark);
      padding: 4px 8px;
      border-radius: 2px;
      font-weight: 400;
    }
    nav a.active {
      background: var(--blue);
      color: var(--white);
      font-weight: 500;
    }
    nav a:hover:not(.active) {
      background: rgba(255,255,255,0.3);
    }

    /* ══════════════════════════════════════════════════════════
       MAIN CONTENT WRAPPER
    ══════════════════════════════════════════════════════════ */
    .page-wrapper {
      background: var(--white);
      max-width: 480px;
      margin: 0 auto;
      min-height: calc(100vh - 36px - 40px);
    }

    /* ══════════════════════════════════════════════════════════
       HERO SECTION
    ══════════════════════════════════════════════════════════ */
    .hero {
      padding: 40px 30px 20px;
      position: relative;
    }

    /* WELCOME TO – stacked centered heading */
    .welcome-heading {
      text-align: center;
      font-family: 'Bevan', serif;
      font-size: 42px;
      line-height: 1.1;
      color: var(--teal);
      text-shadow: 3px 3px 0 var(--dark), 2px 2px 6px rgba(0,0,0,0.25);
      letter-spacing: 2px;
      margin-bottom: 24px;
    }

    /* Hero two-column: image left, letter-grid right */
    .hero-cols {
      display: flex;
      align-items: flex-start;
      gap: 16px;
    }

    .hero-image-wrap {
      flex: 0 0 auto;
    }
    .hero-image-wrap img {
      width: 220px;
      height: 145px;
      object-fit: cover;
      display: block;
      box-shadow: 4px 4px 12px rgba(0,0,0,0.35);
    }

    /* Yellow divider under image */
    .hero-divider {
      width: 160px;
      height: 3px;
      background: var(--yellow);
      margin-top: 14px;
    }

    /* ── Letter grid "All About Ajlina" ─────────────────────
       Columns: A A A
                L B J
                L O L
                  U I
                  T N
                    A
       Col 1 = teal, Col 2 = yellow, Col 3 = teal
    ─────────────────────────────────────────────────────── */
    .letter-grid {
      display: grid;
      grid-template-columns: repeat(3, 36px);
      grid-template-rows: repeat(6, 38px);
      gap: 2px;
      margin-left: auto;
      padding-top: 4px;
    }
    .letter-grid span {
      font-family: 'Bevan', serif;
      font-size: 28px;
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
    }
    .lg-teal   { color: var(--teal); }
    .lg-yellow { color: var(--yellow); }

    /* ══════════════════════════════════════════════════════════
       "STARTEN MIT…" SECTION
    ══════════════════════════════════════════════════════════ */
    .starten-section {
      padding: 20px 30px 30px;
    }

    .starten-title {
      font-family: 'Roboto', sans-serif;
      font-weight: 700;
      font-size: 18px;
      color: var(--dark);
      letter-spacing: 0.5px;
      margin-bottom: 22px;
      text-transform: uppercase;
    }

    /* 2×2 grid of cards */
    .cards-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    .card {
      position: relative;
      overflow: hidden;
      cursor: pointer;
    }
    .card img {
      width: 100%;
      height: 110px;
      object-fit: cover;
      display: block;
      box-shadow: 3px 3px 10px rgba(0,0,0,0.35);
      filter: brightness(0.75);
      transition: filter 0.3s;
    }
    .card:hover img {
      filter: brightness(0.9);
    }
    .card-label {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      font-family: 'Bevan', serif;
      font-size: 20px;
      color: var(--dark);
      text-shadow: 1px 1px 0 #fff, -1px -1px 0 #fff, 1px -1px 0 #fff, -1px 1px 0 #fff, 2px 2px 6px rgba(255,255,255,0.6);
      letter-spacing: 1px;
      line-height: 1.2;
      padding: 8px;
      pointer-events: none;
    }

    /* ══════════════════════════════════════════════════════════
       FOOTER
    ══════════════════════════════════════════════════════════ */
    footer {
      background: var(--dark);
      color: var(--offwhite);
      min-height: 40px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      font-family: 'Roboto', sans-serif;
      font-size: 9px;
      max-width: 100%;
    }
    .footer-left   { display: flex; flex-direction: column; gap: 2px; }
    .footer-left .brand { font-weight: 700; font-size: 10px; }
    .footer-left .tagline { font-size: 8px; opacity: 0.75; }
    .footer-center { opacity: 0.85; }
    .footer-right  {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 11px;
      font-weight: 700;
    }
    .footer-center-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      opacity: 0.85;
    }

    /* ══════════════════════════════════════════════════════════
       PLACEHOLDER IMAGES (Swiss landscape colours)
       Using inline SVG data URIs so no external images needed
    ══════════════════════════════════════════════════════════ */
  </style>
</head>
<body>

  <!-- ═══ HEADER ═══════════════════════════════════════════ -->
  <header>
    <div class="logo">
      <!-- CPU vector icon -->
      <div class="cpu-icon">
        <svg viewBox="0 0 22 22" fill="none" xmlns="http://www.w3.org/2000/svg">
          <!-- chip body -->
          <rect x="6" y="6" width="10" height="10" rx="1" fill="#2F3E46" stroke="#2F3E46" stroke-width="0.5"/>
          <!-- inner core -->
          <rect x="8" y="8" width="6" height="6" rx="0.5" fill="#F9F7F3"/>
          <!-- pins top -->
          <line x1="8.5"  y1="6" x2="8.5"  y2="3.5" stroke="#2F3E46" stroke-width="1.2"/>
          <line x1="11"   y1="6" x2="11"   y2="3.5" stroke="#2F3E46" stroke-width="1.2"/>
          <line x1="13.5" y1="6" x2="13.5" y2="3.5" stroke="#2F3E46" stroke-width="1.2"/>
          <!-- pins bottom -->
          <line x1="8.5"  y1="16" x2="8.5"  y2="18.5" stroke="#2F3E46" stroke-width="1.2"/>
          <line x1="11"   y1="16" x2="11"   y2="18.5" stroke="#2F3E46" stroke-width="1.2"/>
          <line x1="13.5" y1="16" x2="13.5" y2="18.5" stroke="#2F3E46" stroke-width="1.2"/>
          <!-- pins left -->
          <line x1="6" y1="8.5"  x2="3.5" y2="8.5"  stroke="#2F3E46" stroke-width="1.2"/>
          <line x1="6" y1="11"   x2="3.5" y2="11"   stroke="#2F3E46" stroke-width="1.2"/>
          <line x1="6" y1="13.5" x2="3.5" y2="13.5" stroke="#2F3E46" stroke-width="1.2"/>
          <!-- pins right -->
          <line x1="16" y1="8.5"  x2="18.5" y2="8.5"  stroke="#2F3E46" stroke-width="1.2"/>
          <line x1="16" y1="11"   x2="18.5" y2="11"   stroke="#2F3E46" stroke-width="1.2"/>
          <line x1="16" y1="13.5" x2="18.5" y2="13.5" stroke="#2F3E46" stroke-width="1.2"/>
        </svg>
      </div>
      <div class="logo-text">
        <!-- AAA: each A alternates yellow / teal / yellow -->
        <span class="aaa" style="color:var(--dark)">
          <span style="color:var(--yellow)">A</span><span style="color:var(--teal)">A</span><span style="color:var(--yellow)">A</span>
        </span>
        <span class="sub">All About Ajlina</span>
      </div>
    </div>

    <nav>
      <a href="#" class="active">Start</a>
      <a href="#">Über mich</a>
      <a href="#">Fähigkeiten</a>
      <a href="#">Portfolio</a>
      <a href="#">Kontakt</a>
    </nav>
  </header>

  <!-- ═══ PAGE WRAPPER ══════════════════════════════════════ -->
  <div class="page-wrapper">

    <!-- ─── HERO ─────────────────────────────────────────── -->
    <section class="hero">
      <div class="welcome-heading">WELCOME<br>TO</div>

      <div class="hero-cols">
        <!-- Left: mountain lake image + yellow line -->
        <div class="hero-image-wrap">
          <img
            src="https://upload.wikimedia.org/wikipedia/commons/thumb/1/1a/24701-nature-natural-beauty.jpg/1280px-24701-nature-natural-beauty.jpg"
            alt="Bergsee Schweiz"
          />
          <div class="hero-divider"></div>
        </div>

        <!-- Right: staggered letter grid "All About Ajlina" -->
        <!--
          Reading down columns:
          Col 1 (teal):   A L L
          Col 2 (yellow): A B O U T
          Col 3 (teal):   A J L I N A
        -->
        <div class="letter-grid">
          <!-- Row 1 -->
          <span class="lg-teal">A</span>
          <span class="lg-yellow">A</span>
          <span class="lg-teal">A</span>
          <!-- Row 2 -->
          <span class="lg-teal">L</span>
          <span class="lg-yellow">B</span>
          <span class="lg-teal">J</span>
          <!-- Row 3 -->
          <span class="lg-teal">L</span>
          <span class="lg-yellow">O</span>
          <span class="lg-teal">L</span>
          <!-- Row 4 -->
          <span class="lg-teal" style="visibility:hidden"></span>
          <span class="lg-yellow">U</span>
          <span class="lg-teal">I</span>
          <!-- Row 5 -->
          <span class="lg-teal" style="visibility:hidden"></span>
          <span class="lg-yellow">T</span>
          <span class="lg-teal">N</span>
          <!-- Row 6 -->
          <span class="lg-teal" style="visibility:hidden"></span>
          <span class="lg-yellow" style="visibility:hidden"></span>
          <span class="lg-teal">A</span>
        </div>
      </div>
    </section>

    <!-- ─── STARTEN MIT… ──────────────────────────────────── -->
    <section class="starten-section">
      <p class="starten-title">Starten mit…</p>

      <div class="cards-grid">
        <!-- Über mich -->
        <div class="card">
          <img
            src="https://upload.wikimedia.org/wikipedia/commons/thumb/1/1a/24701-nature-natural-beauty.jpg/1280px-24701-nature-natural-beauty.jpg"
            alt="Über mich"
          />
          <div class="card-label">ÜBER MICH</div>
        </div>

        <!-- Fähigkeiten -->
        <div class="card">
          <img
            src="https://upload.wikimedia.org/wikipedia/commons/thumb/5/5c/Oeschinensee_2.jpg/1280px-Oeschinensee_2.jpg"
            alt="Fähigkeiten"
          />
          <div class="card-label">FÄHIG-<br>KEITEN</div>
        </div>

        <!-- Portfolio -->
        <div class="card">
          <img
            src="https://upload.wikimedia.org/wikipedia/commons/thumb/1/1a/24701-nature-natural-beauty.jpg/1280px-24701-nature-natural-beauty.jpg"
            alt="Portfolio"
          />
          <div class="card-label">PORT-<br>FOLIO</div>
        </div>

        <!-- Kontakt -->
        <div class="card">
          <img
            src="https://upload.wikimedia.org/wikipedia/commons/thumb/5/5c/Oeschinensee_2.jpg/1280px-Oeschinensee_2.jpg"
            alt="Kontakt"
          />
          <div class="card-label">KONTAKT</div>
        </div>
      </div>
    </section>

  </div><!-- /page-wrapper -->

  <!-- ═══ FOOTER ════════════════════════════════════════════ -->
  <footer>
    <div class="footer-left">
      <span class="brand">
        <span style="color:var(--yellow)">A</span><span style="color:var(--teal)">A</span><span style="color:var(--yellow)">A</span>
      </span>
      <span class="tagline">All About Ajlina</span>
    </div>
    <div class="footer-center-wrap">
      <span>076 508 79 47</span>
      <span>ajlina.abdeli@edu.gl.zsg.ch</span>
    </div>
    <div class="footer-right">
      <span>&#9679;</span>
      <span>in</span>
    </div>
  </footer>

</body>
</html>
